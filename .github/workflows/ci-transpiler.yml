# Build and Release for Transpiler (sqlglot converter API)
# Builds the multi-arch transpiler image and pushes it to the uniphi ECR.
#
# Uniphi is the only push target: it is the one registry this repo holds
# credentials for. The other five registries the Jenkinsfile fans out to
# (main ECR, GCR, ACR, serverless beta/prod) need org-level secrets that are
# scoped to e6-query-engine and not shared with this repo, so wiring them here
# only produced an empty account id and an "Request ARN is invalid" failure at
# the first assume-role. Add a registry back only once its secret is actually
# readable from e6data/sqlglot.
name: Build - Transpiler

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RELEASE_NAME: transpiler
  # Preserve the legacy Jenkins versioning scheme: 3.0.<build>
  VERSION: 3.0.${{ github.run_number }}
  UNIPHI_ECR_REGISTRY: ${{ secrets.UNIPHI_AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  UNIPHI_ECR_REPOSITORY: transpiler

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-arm64/extras=s3-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup RunsOn Magic Cache
        uses: runs-on/action@v2

      # An unset secret interpolates to the empty string, which yields the
      # nonsense role arn "arn:aws:iam:::role/..." and a bare ".dkr.ecr..."
      # registry. Fail here with a readable message instead of at assume-role.
      - name: Check uniphi credentials are present
        env:
          UNIPHI_AWS_ACCOUNT_ID: ${{ secrets.UNIPHI_AWS_ACCOUNT_ID }}
        run: |
          if [ -z "${UNIPHI_AWS_ACCOUNT_ID:-}" ]; then
            echo "::error::UNIPHI_AWS_ACCOUNT_ID is unset — cannot push the transpiler image."
            exit 1
          fi

      - name: Generate production tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DATE_TAG=$(date +%Y.%m.%d)

          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT

          # Generate all tag variations
          TAGS="latest"
          TAGS="$TAGS,sha-$SHORT_SHA"
          TAGS="$TAGS,$DATE_TAG-$SHORT_SHA"
          TAGS="$TAGS,${{ env.VERSION }}"
          TAGS="$TAGS,${{ env.VERSION }}-$SHORT_SHA"

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Production tags: $TAGS"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Setup Uniphi AWS Creds
        uses: aws-actions/configure-aws-credentials@90a7a1fb1ee4e8d6a99f60d2fd22287e1657e51e # v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.UNIPHI_AWS_ACCOUNT_ID }}:role/GHActionsECRPush
          aws-region: us-east-1

      - name: Login to Uniphi ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.UNIPHI_ECR_REGISTRY }}

      - name: Build and push multi-arch image
        id: build-push
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          TAG_ARGS=""
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_ARGS="$TAG_ARGS -t ${{ env.UNIPHI_ECR_REGISTRY }}/${{ env.UNIPHI_ECR_REPOSITORY }}:$tag"
          done

          echo "Building and pushing image with ${#TAG_ARRAY[@]} tags to Uniphi ECR"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --provenance=mode=max \
            --sbom=true \
            $TAG_ARGS \
            --push \
            -f Dockerfile .

          DIGEST=$(docker buildx imagetools inspect ${{ env.UNIPHI_ECR_REGISTRY }}/${{ env.UNIPHI_ECR_REPOSITORY }}:latest --format '{{json .}}' | jq -r '.manifest.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "Release Complete!"
          echo "Version: ${{ env.VERSION }}"
          echo "Git SHA: ${{ steps.tags.outputs.short_sha }}"
          echo "Digest:  ${{ steps.build-push.outputs.digest }}"
          echo ""
          echo "Pushed tags: ${{ steps.tags.outputs.tags }}"
          echo "Registry:"
          echo "  - ${{ env.UNIPHI_ECR_REGISTRY }}/${{ env.UNIPHI_ECR_REPOSITORY }}"
