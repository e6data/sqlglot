# Build and Release for Transpiler (sqlglot converter API)
# Builds the multi-arch transpiler image and pushes it to the uniphi ECR.
#
# Uniphi is the only push target: it is the one registry this repo holds
# credentials for. The other five registries the Jenkinsfile fans out to
# (main ECR, GCR, ACR, serverless beta/prod) read org-level secrets that are
# scoped to e6-query-engine and not shared with this repo, so wiring them here
# only produced an empty account id and "Request ARN is invalid" at the first
# assume-role. Add a registry back only once its secret is readable from
# e6data/sqlglot.
#
# Each architecture is built on a runner of that architecture and the two are
# merged into one manifest afterwards, exactly as the Jenkinsfile did. Do NOT
# collapse this into a single `--platform linux/amd64,linux/arm64` build: the
# sqlglotrs Rust extension is compiled during the image build, and cargo dies
# under QEMU on Alpine ("Scudo ERROR: CHECK failed @ primary32.h:183" ->
# "qemu: uncaught target signal 6") because musl's hardened allocator does not
# survive user-mode emulation.
name: Build - Transpiler

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RELEASE_NAME: transpiler
  # Preserve the legacy Jenkins versioning scheme: 3.0.<build>
  VERSION: 3.0.${{ github.run_number }}
  UNIPHI_ECR_REGISTRY: ${{ secrets.UNIPHI_AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  UNIPHI_ECR_REPOSITORY: transpiler

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: 8cpu-linux-x64
          - arch: arm64
            platform: linux/arm64
            runner: 8cpu-linux-arm64
    runs-on: runs-on=${{ github.run_id }}/runner=${{ matrix.runner }}/extras=s3-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup RunsOn Magic Cache
        uses: runs-on/action@v2

      # An unset secret interpolates to the empty string, which yields the
      # nonsense role arn "arn:aws:iam:::role/..." and a bare ".dkr.ecr..."
      # registry. Fail here with a readable message instead of at assume-role.
      - name: Check uniphi credentials are present
        env:
          UNIPHI_AWS_ACCOUNT_ID: ${{ secrets.UNIPHI_AWS_ACCOUNT_ID }}
        run: |
          if [ -z "${UNIPHI_AWS_ACCOUNT_ID:-}" ]; then
            echo "::error::UNIPHI_AWS_ACCOUNT_ID is unset — cannot push the transpiler image."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Setup Uniphi AWS Creds
        uses: aws-actions/configure-aws-credentials@90a7a1fb1ee4e8d6a99f60d2fd22287e1657e51e # v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.UNIPHI_AWS_ACCOUNT_ID }}:role/GHActionsECRPush
          aws-region: us-east-1

      - name: Login to Uniphi ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.UNIPHI_ECR_REGISTRY }}

      # Push by digest only; the merge job attaches the human-readable tags to
      # the combined manifest so a half-finished matrix never moves `latest`.
      - name: Build and push ${{ matrix.arch }} by digest
        id: build
        run: |
          set -euo pipefail
          IMAGE="${{ env.UNIPHI_ECR_REGISTRY }}/${{ env.UNIPHI_ECR_REPOSITORY }}"

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --cache-from type=gha,scope=${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.arch }} \
            --provenance=mode=max \
            --sbom=true \
            --output type=image,name=$IMAGE,push-by-digest=true,push=true \
            --metadata-file meta.json \
            -f Dockerfile .

          DIGEST=$(jq -r '."containerimage.digest"' meta.json)
          echo "Built ${{ matrix.arch }} -> $DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-arm64/extras=s3-cache
    steps:
      - name: Generate production tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DATE_TAG=$(date +%Y.%m.%d)

          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT

          # Generate all tag variations
          TAGS="latest"
          TAGS="$TAGS,sha-$SHORT_SHA"
          TAGS="$TAGS,$DATE_TAG-$SHORT_SHA"
          TAGS="$TAGS,${{ env.VERSION }}"
          TAGS="$TAGS,${{ env.VERSION }}-$SHORT_SHA"

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Production tags: $TAGS"

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Setup Uniphi AWS Creds
        uses: aws-actions/configure-aws-credentials@90a7a1fb1ee4e8d6a99f60d2fd22287e1657e51e # v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.UNIPHI_AWS_ACCOUNT_ID }}:role/GHActionsECRPush
          aws-region: us-east-1

      - name: Login to Uniphi ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.UNIPHI_ECR_REGISTRY }}

      - name: Create multi-arch manifest
        id: manifest
        run: |
          set -euo pipefail
          IMAGE="${{ env.UNIPHI_ECR_REGISTRY }}/${{ env.UNIPHI_ECR_REPOSITORY }}"

          TAG_ARGS=""
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_ARGS="$TAG_ARGS -t $IMAGE:$tag"
          done

          SRC_ARGS=""
          for d in /tmp/digests/*; do
            SRC_ARGS="$SRC_ARGS $IMAGE@sha256:$(basename "$d")"
          done
          echo "Merging:$SRC_ARGS"

          docker buildx imagetools create $TAG_ARGS $SRC_ARGS

          DIGEST=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .}}' | jq -r '.manifest.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "Release Complete!"
          echo "Version: ${{ env.VERSION }}"
          echo "Git SHA: ${{ steps.tags.outputs.short_sha }}"
          echo "Digest:  ${{ steps.manifest.outputs.digest }}"
          echo ""
          echo "Pushed tags: ${{ steps.tags.outputs.tags }}"
          echo "Registry:"
          echo "  - ${{ env.UNIPHI_ECR_REGISTRY }}/${{ env.UNIPHI_ECR_REPOSITORY }}"
